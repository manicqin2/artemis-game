<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artemis: Return to the Moon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap">
<style>
:root{--bg:#04060d;--ink:#eef2fb;--dim:#8b96b0;--ln:#ffffff22;--ac:#ff8a3d;--cy:#62e3ff;--ok:#5dffa8;--cd:#0a1022d0;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;pointer-events:none}
#hud{display:flex;justify-content:space-between;gap:14px;padding:12px 18px;font-size:13px;color:var(--dim)}
#hud span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hud b{color:var(--ink);white-space:nowrap}
#scr{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:0 16px 16px;pointer-events:auto}
.w{width:100%;max-width:520px;margin:auto}.w.end{margin:auto auto 0}
h1{font-size:clamp(44px,15vw,88px);line-height:1;letter-spacing:.2em;margin:0 0 10px;text-align:center;padding-left:.2em}
h2{font-size:26px;line-height:1.15;margin:2px 0 8px}
p{margin:0 0 14px}.sub,.dim{color:var(--dim)}.sub{text-align:center;margin-bottom:24px}
.cd{background:var(--cd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:22px;padding:20px;margin:8px 0}
.ms{display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.ms .nm{display:block;font-size:22px;font-weight:700}.ms .ds{display:block;color:var(--dim);font-size:14px}
.ms.off{opacity:.55;cursor:default}.ms:disabled,.row:disabled{opacity:.4;cursor:not-allowed}
.pg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:12px}.pg i{height:4px;border-radius:2px;background:#ffffff1f}.pg i.on{background:var(--ac)}
.tm{color:var(--ac);font-weight:700;font-size:13px}
.how{border-left:2px solid var(--cy);padding-left:12px;color:var(--cy);font-size:14px;margin-bottom:14px}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 22px;font:700 16px "Space Grotesk",system-ui,sans-serif;background:var(--ac);color:#1c0c02;cursor:pointer;width:100%;margin-top:8px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn:disabled{opacity:.4;cursor:not-allowed}.w.end{animation:rise .6s ease-out}@keyframes rise{from{opacity:0;transform:translateY(16px)}}@media (prefers-reduced-motion:reduce){.w.end{animation:none}}.tl{display:grid;gap:8px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:#ffffff0a;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.row small{color:var(--ac);font-weight:700;font-size:12px}.row b{font-size:16px}.row em{font-style:normal;color:var(--ac);letter-spacing:.1em;white-space:nowrap}
.big{font-size:44px;letter-spacing:.12em;color:var(--ac);line-height:1.1;text-align:center}
.win{border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14px}
#act{display:none;margin:auto 16px 14px;height:88px;border:0;border-radius:24px;font:700 18px "Space Grotesk",system-ui,sans-serif;color:#1c0c02;background:linear-gradient(180deg,#ffb067,var(--ac));box-shadow:0 12px 40px #ff8a3d44;pointer-events:auto;touch-action:none;transition:transform .08s,box-shadow .08s}
#act.on{transform:scale(.97);box-shadow:0 0 60px #ff8a3daa}
body.play #act{display:block}body.play #scr{display:none}
button:focus-visible{outline:2px solid var(--cy);outline-offset:3px}.qz{text-align:left;border-top:1px solid var(--ln);margin:10px 0 6px;padding-top:12px}.qz p{margin:6px 0}.qz .row{margin-top:8px}
#fd{display:none;position:fixed;z-index:2;right:16px;top:calc(env(safe-area-inset-top,0px) + 46px);padding:10px 16px;border-radius:14px;border:1px solid var(--cy);background:var(--cd);color:var(--cy);font:700 14px "Space Grotesk",system-ui,sans-serif;pointer-events:auto;cursor:pointer}
body.play.fl:not(.co) #fd{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="hud"></div><div id="scr"></div><button id="act" type="button">Tap</button></div><button id="fd" type="button">Done</button>
<script>
const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d'),SC=$('#scr'),HUD=$('#hud'),AB=$('#act'),R=Math.random,PI=Math.PI;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t,F=(w,s)=>`${w} ${s}px "Space Grotesk",system-ui,sans-serif`;
const cp=(p,u)=>{const n=p.length-1,f=cl(u)*n,i=Math.min(n-1,f|0),t=f-i,s=t*t*(3-2*t);return lp(p[i],p[i+1],s)};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,G=null,held=false,pt=0,last=0,S={m:0,p:0},sv={};
try{sv=JSON.parse(localStorage.getItem('artemis-sv2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('artemis-sv2',JSON.stringify(sv))}catch(e){}};
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const ST=Array.from({length:150},()=>({x:R(),y:R(),z:.15+R()*.85}));

/* ---------- mission data ---------- */
const M=[
{n:'Artemis I',s:'Uncrewed test flight, November 2022',w:'Orion is home. Artemis II is unlocked.',p:[
{t:'Nov 16, 2022',n:'Liftoff',k:'fl',m:'asc',z:'up',f:'SLS lights 39 million newtons of thrust at Pad 39B. Start the countdown, then steer the rocket until it leaves the atmosphere at 100 km. The boosters fall away at about two minutes and the abort tower a little after three.'},
{t:'About 50 min after launch',n:'Reach orbit',k:'fl',m:'orb',f:'The core stage drops away at about 160 km, but Orion is moving too slowly to stay up. At the high point of the path, fire the upper stage forward to lift the low point above 150 km.'},
{t:'About 1½ hours after launch',n:'Trans-lunar injection',k:'fl',m:'tli',f:'The upper stage burns for about 18 minutes to send Orion toward the Moon. The Moon keeps moving, so you aim where it will be in about four days, and Orion must still be able to come home.',o:'Artemis I looped around the Moon and on Nov 28 reached 432,210 km from Earth, a record for a spacecraft built for humans.'},
{t:'Dec 11, 12:40 pm EST',n:'Entry and splashdown',k:'fl',m:'rtn',gl:8,f:'Orion hits the atmosphere at about 40,000 km/h. Set the entry angle: too shallow and it skips back into space, too steep and the g-load climbs. No crew is on board, so up to 8 g still counts as nominal. Parachutes then slow it to about 30 km/h off Baja California.',o:'25½ days and 2.2 million km later, Artemis I had tested Orion’s heat shield and recovery system.'}
]},
{n:'Artemis II',s:'Crewed lunar flyby, April 2026',w:'Humans are back at the Moon. Artemis III is unlocked.',p:[
{t:'Apr 1, 2026 · 6:35 pm EDT',n:'Liftoff',k:'fl',m:'asc',z:'up',f:'Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen ride SLS from Pad 39B in Orion “Integrity”. Count down, then steer the climb until you pass 100 km and leave the air behind.'},
{t:'Day 1',n:'Reach orbit',k:'fl',m:'orb',f:'The upper stage places Orion in orbit around Earth. Fire forward at the high point to lift the low point above 150 km. The crew then checks life support before committing to the Moon.'},
{t:'Day 2',n:'Trans-lunar injection',k:'fl',m:'tli',f:'Orion leaves Earth orbit on a path that swings around the Moon and falls back toward Earth with no big burn needed. Aim where the Moon will be.'},
{t:'Day 6',n:'Lunar flyby',k:'tim',z:'mn',f:'Orion passes about 6,500 km above the Moon and reaches 406,771 km from Earth, farther than any humans have flown. Catch what the crew saw.',e:[['Earthset',.3,.22,.65],['Total solar eclipse',.7,.19,.8],['Far side craters',.5,.17,.95]],o:'Artemis II broke the distance record Apollo 13 set in 1970.'},
{t:'Apr 10, 8:07 pm EDT',n:'Entry and splashdown',k:'fl',m:'rtn',f:'Orion returns at about 40,000 km/h with its heat shield facing about 2,800 °C. Set the entry angle: too shallow and it skips away, too steep and the crew feels more than 5 g. Drogue and main parachutes then bring Orion down off San Diego.',o:'A 10-day flight of about 1.1 million km: humans are back at the Moon.'}
]},
{n:'Artemis III',s:'Planned: Earth-orbit docking test, 2027',w:'Docking rehearsed. Future missions are now open.',p:[
{t:'Planned: 2027',n:'Liftoff',k:'fl',m:'asc',z:'up',f:'Randy Bresnik, Luca Parmitano, Frank Rubio and Andre Douglas ride SLS to low Earth orbit. Count down, then steer the climb out of the atmosphere.'},
{t:'Earth orbit',n:'Docking test',k:'cor',fn:1,path:[.35,.6,.45,.55,.5],hb:.18,T:18,f:'A Blue Origin lander test article waits in orbit. Orion has to line up and dock, the first flight of its docking system.'},
{t:'About two weeks later',n:'Splashdown',k:'tim',z:'ch',f:'After a second rendezvous, this time with a SpaceX Starship test vehicle, Orion returns to the Pacific.',e:[['Drogue parachutes',.3,.16,.9],['Pilot parachutes',.7,.15,1],['Main parachutes',.5,.14,1.1]],o:'Artemis IV, the first landing, is next.'}
]},
{n:'Artemis IV',s:'Planned: first south pole landing, 2028',w:'First footprints since 1972. Artemis V is unlocked.',p:[
{t:'Planned: 2028',n:'Trans-lunar injection',k:'fl',m:'tli',f:'Orion heads for the Moon to meet a commercial lander. Aim at where the Moon will be, not where it is now.'},
{t:'Planned: 2028',n:'South pole descent',k:'ld',f:'Two astronauts ride the lander toward the lunar south pole, where the Sun sits low and shadows run long. Slow down, then touch down gently.',o:'The first crewed landing since Apollo 17 in 1972.'},
{t:'On the surface',n:'Moonwalk',k:'tim',z:'sf',f:'Near permanently shadowed craters that may hold water ice, the crew works through its checklist.',e:[['Collect samples',.3,.2,.6],['Deploy instruments',.7,.18,.75],['Plant flag',.5,.16,.9]]},
{t:'Surface to orbit',n:'Ascent and docking',k:'cor',fn:1,path:[.6,.35,.55,.4,.5],hb:.16,T:18,f:'The lander lifts off and meets Orion in lunar orbit so the whole crew is together again.'},
{t:'Return',n:'Splashdown',k:'tim',z:'ch',f:'After a fiery entry, Orion’s parachutes bring the crew home to the Pacific.',e:[['Drogue parachutes',.3,.16,.9],['Pilot parachutes',.7,.15,1],['Main parachutes',.5,.14,1.1]]}
]},
{n:'Artemis V',s:'Targeted: second landing, 2028',w:'The Moon is open for regular visits. More missions will be added as NASA flies them.',p:[
{t:'Targeted: 2028',n:'Descent',k:'ld',hd:1.3,f:'Another crew descends to the surface. This approach is tougher, so brake early.'},
{t:'On the surface',n:'Moonwalks',k:'tim',z:'sf',f:'NASA aims for roughly one landing a year, so each crew builds on the last.',e:[['Drill a core sample',.25,.17,.7],['Collect samples',.7,.16,.85],['Deploy instruments',.4,.15,1],['Plant flag',.6,.14,1.1]]},
{t:'Surface to orbit',n:'Ascent and docking',k:'cor',fn:1,path:[.5,.7,.4,.55,.45],hb:.14,T:19,f:'Lunar gravity is about one sixth of Earth’s, so liftoff takes far less power, but the rendezvous still has to be exact.'}
]}];
const QZ={
'0-0':['What fuel does the SLS core stage burn?',['Liquid hydrogen and liquid oxygen','Refined kerosene and liquid oxygen','Liquid methane and oxygen'],0,'Its four RS-25 engines burn super-cold liquid hydrogen with liquid oxygen. The two side boosters burn solid fuel.'],
'0-1':['What keeps a spacecraft in orbit?',['It keeps falling around Earth and missing the ground','Gravity switches off above the atmosphere','Its engines keep pushing it up'],0,'Orbit means falling around the planet without ever hitting it.'],
'0-2':['What is the goal of a trans-lunar injection burn?',['To speed Orion up so it heads for the Moon','To slow Orion down for its trip back to Earth','To pull Orion into a stable orbit around the Moon'],0,'It adds speed so the path reaches the Moon’s orbit.'],
'0-3':['Why does Orion need a heat shield?',['Air friction heats it to about 2,800 °C','The Sun is much hotter near the Moon','Moon dust burns when it touches the capsule'],0,'Hitting the air at about 11,000 m/s makes the shield glow.'],
'1-0':['What gives SLS most of its liftoff thrust?',['The two boosters on its sides','The upper stage engine','The four engines on the core stage'],0,'The two solid boosters supply more than 75% of liftoff thrust.'],
'1-1':['Why check Orion in Earth orbit before leaving for the Moon?',['To test its life support while still close to home','To top up fuel at a space station','To drop off the booster rockets'],0,'If something is wrong, the crew is still near Earth.'],
'1-2':['What is the main purpose of Artemis II?',['To fly astronauts around the Moon and back','To land astronauts at the Moon’s south pole','To build a base on the Moon'],0,'It is the first crewed test of Orion on a trip to the Moon.'],
'1-3':['How far from Earth did Artemis II travel?',['About 400,000 km, past the Moon','About 40,000 km, high above satellites','About 4,000 km'],0,'That is farther from Earth than humans had ever flown.'],
'1-4':['How fast is Orion going when it returns to Earth?',['About 40,000 km/h, Mach 32','About 4,000 km/h, as fast as a fighter jet','About 400 km/h, like a bullet train'],0,'That speed is why Orion needs a heat shield and a careful entry angle.'],
'2-0':['Why does Artemis III stay in Earth orbit?',['To rehearse docking with landers close to home','To test a new heat shield','Because SLS cannot reach the Moon yet'],0,'It practises the hard parts of a landing mission near home.'],
'2-1':['Why must Orion dock with a lander?',['The lander carries the astronauts down to the Moon','Orion needs its extra oxygen','Orion has no engine of its own'],0,'Orion stays in orbit while a separate lander takes the crew to the surface.'],
'2-2':['Who builds the Artemis Moon landers?',['SpaceX and Blue Origin','Lockheed Martin and Boeing','NASA builds them alone, as in Apollo'],0,'NASA works with companies to build the landers.'],
'3-0':['Why aim ahead of the Moon instead of straight at it?',['The Moon keeps moving around Earth while Orion travels','Radio signals take time to reach it','The Moon’s far side is easier to land on'],0,'The trip takes days, and the Moon moves the whole time.'],
'3-1':['Why go to the Moon’s south pole?',['Craters there may hold water ice','It is the flattest place on the Moon','Apollo already left a base camp there'],0,'Ice can become drinking water and rocket fuel.'],
'3-2':['When did people last walk on the Moon?',['In 1972, on Apollo 17','In 1969, on the Apollo 11 mission','In 1981, on a space shuttle mission'],0,'Artemis IV would end a gap of over 50 years.'],
'3-3':['Why does the crew return to Orion?',['Orion is the ship that carries them home to Earth','The lander flies them straight home','Orion has the only working radio'],0,'The lander only travels between the Moon’s surface and lunar orbit.'],
'4-0':['Why does NASA want regular Moon landings?',['To practise living and working in space before Mars','To mine the Moon and sell what is found','To build a bigger telescope than Hubble'],0,'The Moon is a training ground for longer trips.'],
'4-1':['What can Moon rock samples tell scientists?',['How the Moon and Earth formed','Where life lives on the Moon','When the next solar flare will hit'],0,'Moon rocks are a record of the early solar system.'],
'4-2':['Which planet is the long-term goal after the Moon?',['Mars','Venus','Jupiter'],0,'What NASA learns on the Moon helps prepare for Mars.']
};
const HOW={asc:'Tap when the countdown marker reaches the green zone (T−6) to light the four main engines. The boosters fire at T−0. Once the tower is clear, hold to tilt toward the horizon and release to keep the angle. Put the white dot on the green diamond and keep the air-load bar out of the red until you pass 100 km.',ld:'Hold to fire the descent engine. Touch down slowly and keep fuel in reserve.',dk:'Hold to thrust up, let go to drift down. Stay inside the funnel as it narrows to the docking port.',tim:'Tap the button when the marker crosses the green zone.',orb:'Watch the timer: hold to burn forward when Orion nears the high point of its path. Stop when the low point is above 150 km, then press Done.',tli:'Wait for the green zone, then hold to burn. Stop when the dotted path loops around the Moon marker and comes back to Earth, then tap Coast. Too much speed and Orion never returns.',rtn:'Set the entry angle before Orion reaches the air: hold to steepen, release to flatten. Too shallow and Orion skips back into space; too steep and the g-load climbs. Then the autopilot flies the entry and the parachutes open by themselves.'};

/* ---------- screens ---------- */
const sr=n=>'★'.repeat(n)+'☆'.repeat(3-n),tot=m=>M[m].p.reduce((a,_,i)=>a+(sv[m+'-'+i]||0),0),pass=k=>sv[k]>0&&(!QZ[k]||sv['p'+k]),cmp=m=>M[m].p.every((_,i)=>pass(m+'-'+i));
const hbf=(P,u)=>P.fn?P.hb*(1.5-1.1*u):P.hb,ins=m=>M[m].p.filter((_,i)=>sv['q'+m+'-'+i]).length;
const setH=(l,r)=>{HUD.innerHTML=`<span>${l}</span><b>${r}</b>`};
const show=(h,end)=>{SC.innerHTML=`<div class="w${end?' end':''}">${h}</div>`;SC.scrollTop=0};
const FM=3;
function menu(f){const ix=M.map((_,i)=>i).filter(i=>(i>=FM)==!!f);
 G=null;document.body.classList.remove('play');
 setH(f?'Future missions':'Artemis program','★ '+ix.reduce((a,i)=>a+tot(i),0)+' / '+ix.reduce((a,i)=>a+M[i].p.length*3,0)+' · ✦ '+ix.reduce((a,i)=>a+ins(i),0));
 show(`${f?'<h2>Future missions</h2><p class="dim">Flights NASA has planned but not yet flown. Details may change.</p>':'<h1>ARTEMIS</h1><p class="sub">Fly every step of the return to the Moon.</p>'}`+ix.map(i=>{const m=M[i],lk=i>0&&!cmp(i-1);return `<button class="cd ms" data-m="${i}"${lk?' disabled':''}><span class="nm">${m.n}</span><span class="ds">${lk?'Finish '+M[i-1].n+' to unlock':m.s}</span><span class="pg">${m.p.map((_,j)=>`<i${sv[i+'-'+j]?' class="on"':''}></i>`).join('')}</span></button>`}).join('')+`${f?'<button class="btn g" id="bk">Back to the main missions</button>':'<button class="btn g" id="fu">If you want to experience future missions</button>'}`);
 SC.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>tl(+b.dataset.m));if(f)$('#bk').onclick=()=>menu();else $('#fu').onclick=()=>menu(1);
}
function tl(m){
 S.m=m;G=null;document.body.classList.remove('play');
 const A=M[m],n=A.p.length,full=cmp(m),rk=tot(m)>=n*2.7?'Flight Director':tot(m)>=n*2?'Flight Controller':'Mission Specialist';
 setH(A.n,'★ '+tot(m)+' / '+n*3);
 show(`<div class="cd"><h2>${A.n}</h2><p class="dim">${A.s}</p><div class="tl">`+A.p.map((p,i)=>{const lk=i>0&&!pass(m+'-'+(i-1));return `<button class="row" data-p="${i}"${lk?' disabled':''}><span><small>${p.t}</small><br><b>${p.n}</b></span><em>${sr(sv[m+'-'+i]||0)}${sv['q'+m+'-'+i]?' ✦':''}</em></button>`}).join('')+`</div>${full?`<p class="win">${A.w} Rank: ${rk}${ins(m)==n?' · Science Officer':''}.</p>`:''}<button class="btn g" id="bk">All missions</button></div>`);
 SC.querySelectorAll('.row').forEach(b=>b.onclick=()=>brief(+b.dataset.p));$('#bk').onclick=()=>menu(m>=FM);
}
function brief(i){
 S.p=i;G=null;const A=M[S.m],P=A.p[i];setH(A.n+' · step '+(i+1)+' of '+A.p.length,'');
 show(`<div class="cd"><div class="tm">${P.t}</div><h2>${P.n}</h2><p>${P.f}</p><div class="how">${HOW[P.fn?'dk':P.k=='fl'?P.m:P.k]}</div><button class="btn" id="go">Begin</button><button class="btn g" id="bk">Back</button></div>`);
 $('#go').onclick=start;$('#bk').onclick=()=>tl(S.m);
}
function lock(){SC.style.pointerEvents='none';clearTimeout(lock.t);lock.t=setTimeout(()=>{SC.style.pointerEvents=''},1500)}
function quiz(st){const k=S.m+'-'+S.p,Q=QZ[k],el=$('#qz');if(!st||!Q||sv['p'+k])return;$('#nx').disabled=true;el.innerHTML=`<div class=qz><div class=tm>Flight director’s question · answer to continue</div><p>${Q[0]}</p>${[0,1,2].sort(()=>R()-.5).map(i=>`<button class=row data-a=${i}>${Q[1][i]}</button>`).join('')}<p class=dim id=qm></p></div>`;el.querySelectorAll('.row').forEach(b=>b.onclick=()=>{const a=+b.dataset.a,qm=$('#qm');if(a!=Q[2]){el.dataset.w=1;b.disabled=true;b.style.opacity=.45;b.style.borderColor='#ff5468';qm.textContent='Not quite. Try another answer.';return}el.querySelectorAll('.row').forEach(r=>{r.disabled=true;r.style.opacity=.45});b.style.opacity=1;b.style.borderColor='#5dffa8';sv['p'+k]=1;if(!el.dataset.w)sv['q'+k]=1;save();$('#nx').disabled=false;qm.textContent=(el.dataset.w?'Correct. ':'Correct, +1 ✦. ')+Q[3]})}
function res(q,st){
 const A=M[S.m],P=A.p[S.p],nx=S.p<A.p.length-1;setH(A.n,P.n);
 show(`<div class="cd" style="text-align:center"><div class="big">${sr(st)}</div><h2>${['Anomaly','Marginal','Good','Nominal'][st]}</h2><p class="dim">Accuracy ${Math.round(q*100)}%. ${G.why||''}${st?(P.o||''):'Flight rules call for another attempt.'}</p><div id=qz></div>${st?`<button class="btn" id="nx">${nx?'Next step':'Mission summary'}</button>`:''}<button class="btn g" id="rt">Retry</button><button class="btn g" id="bk">Mission steps</button></div>`,1);
 if(st)$('#nx').onclick=()=>nx?brief(S.p+1):tl(S.m);
 $('#rt').onclick=start;quiz(st);lock();$('#bk').onclick=()=>tl(S.m);
}

/* ---------- mechanics ---------- */
const U=()=>({u:Math.min(H*.03,W*.07),cx:W/2,cy:H*.5});
function start(){
 const P=M[S.m].p[S.p];held=false;
 G={P,i:0,et:0,ph:R()*2,pos:0,q:[],sky:.1,pr:0,parts:[],f:{srb:1,las:1,core:1,arr:0},msg:'',mc:'',mt:0,fl:0,lock:0,end:0,rd:1.4,ra:0,s:0,cs:0,on:0,el:0,d:P.path?P.path[0]:0,vd:0,ins:0,tr:[],fin:0,y:1,v:.05,fu:1};
 document.body.classList.remove('co');if(P.k=='fl'){fli();document.body.classList.toggle('fl',P.m=='orb'||P.m=='tli');FD.textContent=P.m=='tli'?'Coast to the Moon ▸':'Done ✓'}else document.body.classList.remove('fl');
